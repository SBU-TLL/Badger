# DDEV override: local-dev Shibboleth auth simulation for the Badger-family apps.
# Lives under .ddev/ — never deployed. APP_ENV gates the mock (defaults to production).
# The 6 Badger apps Shibboleth-protect giveYourselfCredit.php (reads $_SERVER mail/nickname/sn).
# NOTE: cbpe/orsee is a separate legacy PHP-5+MySQL app, NOT served by this config.
web_environment:
  - APP_ENV=local
  - MOCK_CN=teststudent
  - MOCK_MAIL=teststudent@stonybrook.edu
  - MOCK_NICKNAME=Test
  - MOCK_SN=Student
